server {
    listen 80;
    server_name chanwook.kr www.chanwook.kr;

    # HTTP를 HTTPS로 리다이렉트
    return 301 https://$server_name$request_uri;
}

server {
    # Ubuntu 22.04 기본 nginx(1.18)는 `http2 on;`(1.25.1+) 미지원 → listen 파라미터 방식 사용
    listen 443 ssl http2;

    server_name chanwook.kr www.chanwook.kr;

    # Let's encrypt
    ssl_certificate /etc/letsencrypt/live/chanwook.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chanwook.kr/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Frontend (Astro SSR, @astrojs/node 어댑터) - 루트 경로
    # frontend/dist는 정적 파일이 아니라 dist/server/entry.mjs(PM2가 4321에서 구동)이므로
    # nginx는 정적 서빙(try_files) 대신 이 포트로 프록시한다.
    location / {
        limit_req zone=general_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API - /api 경로
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 로그 설정
    access_log /var/log/nginx/blog_access.log;
    error_log /var/log/nginx/blog_error.log;
}
