# Rate limiting zones for chanwook.kr
# /etc/nginx/conf.d/*.conf is included inside the http {} block, so these
# zone definitions must live here rather than inside nginx-blog.conf's
# server {} block (limit_req_zone is only valid at the http level).
#
# general: allow bursts of normal browsing, still cap abusive scanners/bots
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
# api: tighter, since /api covers write endpoints (posts/projects/login)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
